spring:
  application:
    name: backend-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    property-naming-strategy: SNAKE_CASE
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:safespace-dev-f82ac}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-must-be-at-least-32-characters}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  local-admin:
    username: ${LOCAL_ADMIN_USERNAME:admin}
    password: ${LOCAL_ADMIN_PASSWORD:}
  ai:
    enabled: ${AI_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    max-input-characters: ${AI_MAX_INPUT_CHARACTERS:4000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:500}
    max-output-characters: ${AI_MAX_OUTPUT_CHARACTERS:4000}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:12}
  password-reset:
    reset-url-base: ${PASSWORD_RESET_URL_BASE:http://localhost:8080/reset-password?token=}
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:15}
    max-requests-per-window: ${PASSWORD_RESET_MAX_REQUESTS:3}
    window-minutes: ${PASSWORD_RESET_WINDOW_MINUTES:15}
  payment:
    max-voucher-bytes: ${PAYMENT_MAX_VOUCHER_BYTES:700000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
